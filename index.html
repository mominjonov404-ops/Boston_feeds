["Xatolik: ","Ошибка: ","Error: "],["Tarif: ","Тариф: ","Plan: "],["Amal qilish muddati: ","Действует до: ","Valid until: "],
["Dostavka: ","Доставка: ","Delivery: "],["Dostavka ","Доставка ","Delivery "],["Izoh: ","Комментарий: ","Note: "],["Versiya ","Версия ","Version "]
];
const TM=new Map(TRN.map(r=>[r[0],r])),PM=new Map(PFX.map(r=>[r[0],r]));
const LI={ru:1,en:2};
function tr(s){
 if(SET.lang==='uz'||typeof s!=='string'||!s)return s;
 const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),k=m[2];if(!k)return s;
 const i=LI[SET.lang];let r=null;
 if(TM.has(k))r=TM.get(k)[i];
 else{
  for(const [p,row] of PM){if(k.startsWith(p)&&k.length>p.length){r=row[i]+tr(k.slice(p.length));break}}
  if(r===null&&k.includes(' · ')){const parts=k.split(' · '),o=parts.map(x=>tr(x));if(o.join('|')!==parts.join('|'))r=o.join(' · ')}
  if(r===null){const q=k.match(/^(\d+) ta$/);if(q)r=SET.lang==='ru'?q[1]+' шт.':q[1]+' pcs'}
 }
 return r===null?s:m[1]+r+m[3]}
function trNode(root){
 if(SET.lang==='uz'||!root)return;
 if(root.nodeType===3){const n=tr(root.nodeValue);if(n!==root.nodeValue)root.nodeValue=n;return}
 if(root.nodeType!==1)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let x;
 while(x=w.nextNode()){if(x.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(x.parentNode.tagName))continue;const n=tr(x.nodeValue);if(n!==x.nodeValue)x.nodeValue=n}
 const at=(el)=>['placeholder','title','aria-label'].forEach(a=>{if(el.hasAttribute&&el.hasAttribute(a)){const v=el.getAttribute(a),n=tr(v);if(n!==v)el.setAttribute(a,n)}});
 at(root);root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(at)}
function startTr(){
 new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
 trNode(document.body)}

async function compress(file,max=1100){return new Promise(r=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.82)};img.src=URL.createObjectURL(file)})}

function itemRow(i){const q=S.cart.q[i.id]||0;return `<div class="it ${i.available?'':'off'}">${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:`<div class="ph">${ic('image',22)}</div>`}<div class="im"><b>${esc(i.name)}</b><small>${esc(i.description||'')}</small><div class="pr">${som(i.price)}</div></div><div class="qty">${!i.available?'<small>Tugagan</small>':q?`<button onclick="chg('${i.id}',-1)">${ic('minus',16)}</button><b>${q}</b><button onclick="chg('${i.id}',1)">${ic('plus',16)}</button>`:`<button class="add" onclick="chg('${i.id}',1)">${ic('plus',16)}</button>`}</div></div>`}
function menuHtml(){const q=($('#mq')?.value||'').trim().toLowerCase();const g={};
 S.items.filter(i=>!q||(i.name+' '+(i.description||'')).toLowerCase().includes(q)).forEach(i=>(g[i.category||'Boshqa']??=[]).push(i));
 const ks=Object.keys(g);
 if($('#mnav'))$('#mnav').innerHTML=ks.length>1?ks.map((k,n)=>`<button class="chip" onclick="document.getElementById('sec${n}').scrollIntoView({behavior:'smooth',block:'start'})">${esc(k)}</button>`).join(''):'';
 $('#menu').innerHTML=ks.map((k,n)=>`<h3 class="mh" id="sec${n}">${esc(k)}</h3>${g[k].map(itemRow).join('')}`).join('')||empty(q?'Hech narsa topilmadi':"Menyu hali to'ldirilmagan");cartBar()}
function chg(id,d){const q=(S.cart.q[id]||0)+d;if(q<=0)delete S.cart.q[id];else S.cart.q[id]=q;menuHtml()}
const cartTotal=()=>S.items.reduce((s,i)=>s+(S.cart.q[i.id]||0)*i.price,0);
function cartBar(){const n=Object.values(S.cart.q).reduce((a,b)=>a+b,0);$('#cbar').innerHTML=n&&live(S.cv)?`<button class="cbtn" onclick="checkout()"><span>${ic('cart',18)} ${n} ta</span><b>${som(cartTotal())}</b><span>Buyurtma</span></button>`:''}
function checkout(){const v=S.cv;const t=[];if(v.delivery_mode!=='none')t.push(['delivery','Dostavka']);t.push(['pickup','Olib ketaman'],['dinein','Borib yeyman']);
 modal(`<div class="row sp"><h3 style="margin:0">Buyurtma</h3><button class="btn sm" onclick="closeModal()">${ic('x',16)}</button></div><form onsubmit="sendOrder(event)"><label>Ismingiz<input name="name" required></label><label>Telefon<input name="phone" type="tel" required placeholder="+998 ..."></label><div class="seg">${t.map((x,k)=>`<label class="sg"><input type="radio" name="type" value="${x[0]}" ${k?'':'checked'} onchange="typeCh()"><span>${x[1]}</span></label>`).join('')}</div><div id="addr"><label>Manzil<input name="address" placeholder="Ko'cha, uy, mo'ljal"></label></div><label>Izoh (ixtiyoriy)<input name="note"></label><div id="sum"></div><button class="btn pri full">Buyurtma berish</button></form>`);typeCh()}
function typeCh(){const f=$('#modal form');if(!f)return;const t=f.type.value,v=S.cv;const d=t==='delivery';$('#addr').style.display=d?'block':'none';f.address.required=d;
 const fee=d&&v.delivery_mode==='paid'?v.delivery_fee:0;$('#sum').innerHTML=`<div class="row sp"><span>Taomlar</span><b>${som(cartTotal())}</b></div>${d?`<div class="row sp"><span>Dostavka</span><b>${v.delivery_mode==='paid'?som(fee):'Bepul'}</b></div>`:''}<div class="row sp"><span>Jami</span><b>${som(cartTotal()+fee)}</b></div>`}
async function sendOrder(e){e.preventDefault();const f=new FormData(e.target),v=S.cv,type=f.get('type');
 const items=S.items.filter(i=>S.cart.q[i.id]).map(i=>({n:i.name,p:i.price,q:S.cart.q[i.id]}));
 const fee=type==='delivery'&&v.delivery_mode==='paid'?v.delivery_fee:0;
 const {error}=await sb.from('tm_orders').insert({venue_id:v.id,customer_name:f.get('name'),phone:f.get('phone'),type,address:type==='delivery'?f.get('address'):null,note:f.get('note'),items,delivery_fee:fee,total:cartTotal()+fee});
 if(error)return toast('Xatolik: '+error.message,1);
 S.cart={v:v.id,q:{}};menuHtml();
 modal(`<h3>Buyurtma qabul qilindi</h3><p><b>${esc(v.name)}</b> ${tr("buyurtmangizni ko'rib chiqadi.")} ${v.phone?tr("Savol bo'lsa qo'ng'iroq qiling:"):''}</p>${v.phone?`<a class="btn" href="tel:${esc(v.phone)}">${ic('phone',16)} ${esc(v.phone)}</a>`:''}<button class="btn pri full" onclick="closeModal()">Yopish</button>`)}

/* ---------- Kirish ---------- */
function loginPage(mode='in'){S.onLive=null;
 $('#app').innerHTML=`<div class="wrap" style="max-width:440px"><div class="box"><div class="tabs"><button class="tab ${mode==='in'?'on':''}" onclick="loginPage('in')">Kirish</button><button class="tab ${mode==='up'?'on':''}" onclick="loginPage('up')">Kafe ochish</button></div><form onsubmit="doAuth(event,'${mode}')">${mode==='up'?'<label>Ismingiz<input name="name" required></label>':''}<label>Email<input name="email" type="email" required></label><label>Parol<input name="password" type="password" minlength="6" required></label><button class="btn pri full">${mode==='in'?'Kirish':"Ro'yxatdan o'tish"}</button></form><p style="text-align:center;margin:16px 0 2px"><small>${mode==='in'?"Hisobingiz yo'qmi?":"Hisobingiz bormi?"}</small> <a href="javascript:void 0" onclick="loginPage('${mode==='in'?'up':'in'}')" style="color:var(--pri2);font-weight:800">${mode==='in'?"Ro'yxatdan o'ting":'Kirish'}</a></p></div></div>`}
async function doAuth(e,mode){e.preventDefault();const f=new FormData(e.target);let r;
 if(mode==='in')r=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
 else r=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{full_name:f.get('name')}}});
 if(r.error)return toast(r.error.message,1);
 if(!r.data.session)return toast('Emailingizga tasdiqlash xati yuborildi');
 await loadUser();location.hash='#/panel'}
async function logout(){await sb.auth.signOut();await loadUser();location.hash='#/'}

/* ---------- Kafe egasi kabineti ---------- */
async function panelPage(){S.onLive=null;
 if(!S.user){location.hash='#/login';return}
 const {data:v}=await sb.from('tm_venues').select('*').eq('owner_id',S.user.id).maybeSingle();S.my=v;
 if(!v)return createVenueForm();
 renderPanel()}
function catOpts(sel){return CATS.slice(1).map(c=>`<option value="${c}" ${sel===c?'selected':''}>${c}</option>`).join('')}
function createVenueForm(){
 $('#app').innerHTML=`<div class="wrap" style="max-width:520px"><div class="row sp"><h2>Sahifangizni yarating</h2><button class="btn sm" onclick="logout()">${ic('out',16)} Chiqish</button></div><form class="box" onsubmit="createVenue(event)"><label>Nomi<input name="name" required></label><label>Turi<select name="category">${catOpts()}</select></label><label>Telefon<input name="phone" type="tel" required></label><label>Manzil<input name="address"></label><label>Ish vaqti<input name="open_hours" placeholder="09:00 - 23:00"></label><label>Qisqacha tavsif<textarea name="description" rows="3"></textarea></label><button class="btn pri full">Yaratish</button></form></div>`}
async function createVenue(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 const {error}=await sb.from('tm_venues').insert({...f,owner_id:S.user.id});if(error)return toast(error.message,1);toast('Sahifa yaratildi');panelPage()}
function vstat(v){if(v.status==='blocked')return '<span class="tag red">Bloklangan</span>';if(v.status==='pending')return '<span class="tag yel">Tasdiq kutilmoqda</span>';if(!live(v))return '<span class="tag red">Muddat tugagan</span>';return '<span class="tag green">Faol</span>'}
function renderPanel(){const v=S.my;
 $('#app').innerHTML=`<div class="wrap"><div class="row sp"><div><h2 style="margin:0">${esc(v.name)}</h2>${vstat(v)} ${v.plan==='super'?'<span class="tag yel">Super Pro</span>':''}</div><div class="row"><a class="btn sm" href="#/v/${v.id}">Sahifam</a><button class="btn sm" onclick="logout()">${ic('out',16)}</button></div></div>
 ${!live(v)?`<div class="ann">Sahifangiz hammaga ko'rinishi uchun "To'lov" bo'limida chek yuboring. Admin tasdiqlagach sahifa ochiladi.</div>`:''}
 <div class="tabs">${[['orders','Buyurtmalar'],['menu','Menyu'],['page','Sahifa'],['pay',"To'lov"]].map(t=>`<button class="tab ${P.tab===t[0]?'on':''}" onclick="P.tab='${t[0]}';renderPanel()">${t[1]}</button>`).join('')}</div><div id="pbody"></div></div>`;
 S.onLive=null;({orders:tabOrders,menu:tabMenu,page:tabPage,pay:tabPay})[P.tab]()}

async function tabOrders(){S.onLive=()=>{if(P.tab==='orders'&&$('#pbody'))tabOrders()};
 const {data}=await sb.from('tm_orders').select('*').eq('venue_id',S.my.id).order('created_at',{ascending:false}).limit(60);
 $('#pbody').innerHTML=(data||[]).map(o=>`<div class="ord st-${o.status}"><div class="row sp"><b>${esc(o.customer_name)}</b><span class="tag">${ST[o.status]}</span></div><small>${TY[o.type]} · ${new Date(o.created_at).toLocaleString(LOC())}</small><div>${o.items.map(i=>`${esc(i.n)} x${i.q}`).join(', ')}</div>${o.address?`<div class="meta">${ic('pin',15)} ${esc(o.address)}</div>`:''}${o.note?`<div>Izoh: ${esc(o.note)}</div>`:''}<div class="row sp"><a class="btn sm" href="tel:${esc(o.phone)}">${ic('phone',15)} ${esc(o.phone)}</a><b>${som(o.total)}</b></div><div class="row">${Object.keys(ST).filter(k=>k!==o.status).map(k=>`<button class="btn sm ${k==='cancel'?'bad':''}" onclick="setSt('${o.id}','${k}')">${ST[k]}</button>`).join('')}</div></div>`).join('')||empty('Buyurtmalar hali yo\'q')}
async function setSt(id,s){const {error}=await sb.from('tm_orders').update({status:s}).eq('id',id);if(error)return toast(error.message,1);tabOrders()}

async function tabMenu(){
 const {data}=await sb.from('tm_menu_items').select('*').eq('venue_id',S.my.id).order('category').order('name');S.mi=data||[];
 $('#pbody').innerHTML=`<button class="btn pri" onclick="itemForm()">${ic('plus',16)} Taom qo'shish</button><div style="margin-top:10px">${S.mi.map(i=>`<div class="it ${i.available?'':'off'}">${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:`<div class="ph">${ic('image',22)}</div>`}<div class="im"><b>${esc(i.name)}</b><small>${esc(i.category||'')}</small><div class="pr">${som(i.price)}</div></div><div class="row"><button class="btn sm" onclick="togItem('${i.id}',${!i.available})">${i.available?'Tugadi':'Bor'}</button><button class="btn sm" onclick="itemForm('${i.id}')">${ic('edit',15)}</button><button class="btn sm bad" onclick="delItem('${i.id}')">${ic('trash',15)}</button></div></div>`).join('')||empty('Menyu bo\'sh. Birinchi taomni qo\'shing')}</div>`}
function itemForm(id){const i=S.mi.find(x=>x.id===id)||{};
 modal(`<div class="row sp"><h3 style="margin:0">${id?'Taomni tahrirlash':"Yangi taom"}</h3><button class="btn sm" onclick="closeModal()">${ic('x',16)}</button></div><form onsubmit="saveItem(event,'${id||''}')"><label>Nomi<input name="name" required value="${esc(i.name)}"></label><label>Narxi (so'm)<input name="price" type="number" min="0" required value="${i.price??''}"></label><label>Bo'lim<input name="category" list="cl" value="${esc(i.category)}" placeholder="Masalan: Birinchi taomlar"></label><datalist id="cl"><option value="Birinchi taomlar"><option value="Ikkinchi taomlar"><option value="Fast-food"><option value="Salatlar"><option value="Non va somsa"><option value="Ichimliklar"><option value="Shirinliklar"></datalist><label>Tavsif<textarea name="description" rows="2">${esc(i.description)}</textarea></label><label>Rasm<input type="file" name="file" accept="image/*"></label><label class="row"><input type="checkbox" name="available" ${i.available===false?'':'checked'}> Sotuvda bor</label><button class="btn pri full">Saqlash</button></form>`)}
async function saveItem(e,id){e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('button.pri');btn.disabled=true;
 try{const row={venue_id:S.my.id,name:f.get('name'),price:+f.get('price'),category:f.get('category')||null,description:f.get('description')||null,available:f.get('available')==='on'};
 const file=f.get('file');if(file&&file.size)row.image_url=await upload(file,'menu');
 const r=id?await sb.from('tm_menu_items').update(row).eq('id',id):await sb.from('tm_menu_items').insert(row);if(r.error)throw r.error;
 closeModal();tabMenu()}catch(err){toast(err.message,1);btn.disabled=false}}
async function togItem(id,v){await sb.from('tm_menu_items').update({available:v}).eq('id',id);tabMenu()}
async function delItem(id){if(!confirm(tr("O'chirilsinmi?")))return;await sb.from('tm_menu_items').delete().eq('id',id);tabMenu()}

function tabPage(){const v=S.my;
 $('#pbody').innerHTML=`<form class="box" onsubmit="saveVenue(event)"><label>Nomi<input name="name" required value="${esc(v.name)}"></label><label>Turi<select name="category">${catOpts(v.category)}</select></label><label>Telefon<input name="phone" value="${esc(v.phone)}"></label><label>Manzil<input name="address" value="${esc(v.address)}"></label><label>Ish vaqti<input name="open_hours" value="${esc(v.open_hours)}"></label><label>Tavsif<textarea name="description" rows="3">${esc(v.description)}</textarea></label><label>Dostavka<select name="delivery_mode" onchange="this.form.delivery_fee.style.display=this.value==='paid'?'block':'none'"><option value="free" ${v.delivery_mode==='free'?'selected':''}>Bepul (kafe hisobidan)</option><option value="paid" ${v.delivery_mode==='paid'?'selected':''}>Haridor to'laydi</option><option value="none" ${v.delivery_mode==='none'?'selected':''}>Dostavka yo'q</option></select><input name="delivery_fee" type="number" min="0" placeholder="Dostavka narxi (so'm)" value="${v.delivery_fee||0}" style="display:${v.delivery_mode==='paid'?'block':'none'}"></label><label>Muqova rasmi${v.cover_url?`<br><img src="${esc(v.cover_url)}" class="rc">`:''}<input type="file" name="file" accept="image/*"></label><button class="btn pri full">Saqlash</button></form>`}
async function saveVenue(e){e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('button.pri');btn.disabled=true;
 try{const row={name:f.get('name'),category:f.get('category'),phone:f.get('phone'),address:f.get('address'),open_hours:f.get('open_hours'),description:f.get('description'),delivery_mode:f.get('delivery_mode'),delivery_fee:+f.get('delivery_fee')||0};
 const file=f.get('file');if(file&&file.size)row.cover_url=await upload(file,'cover');
 const {error}=await sb.from('tm_venues').update(row).eq('id',S.my.id);if(error)throw error;
 const {data}=await sb.from('tm_venues').select('*').eq('id',S.my.id).single();S.my=data;toast('Saqlandi');renderPanel()}catch(err){toast(err.message,1);btn.disabled=false}}

async function tabPay(){const v=S.my;
 const {data:ps}=await sb.from('tm_payments').select('*').eq('venue_id',v.id).order('created_at',{ascending:false});
 const pt=s=>s==='approved'?'<span class="tag green">Tasdiqlandi</span>':s==='rejected'?'<span class="tag red">Rad etildi</span>':'<span class="tag yel">Kutilmoqda</span>';
 $('#pbody').innerHTML=`<div class="box"><b>Joriy holat</b><p>Tarif: ${v.plan==='super'?'Super Pro':'Oddiy'}<br>${v.paid_until?'Amal qilish muddati: '+esc(v.paid_until):"Hali to'lanmagan"}</p></div>
 <div class="box"><b>To'lov qilish</b><p>Kartaga o'tkazing:<br><b>${esc(S.set.card)}</b> (${esc(S.set.card_owner)})</p><form onsubmit="sendPay(event)"><label>Tarif<select name="plan"><option value="standard">${tr('Oddiy')}: ${som(S.set.price_standard)} / ${tr('oy')}</option><option value="super">${tr('Super Pro (saytning boshida)')}: ${som(S.set.price_super)} / ${tr('oy')}</option></select></label><label>Chek rasmi<input type="file" name="file" accept="image/*" required></label><button class="btn pri full">Chekni yuborish</button></form></div>
 ${(ps||[]).map(p=>`<div class="box row sp"><span>${new Date(p.created_at).toLocaleDateString(LOC())} · ${p.plan==='super'?'Super Pro':'Oddiy'} · ${som(p.amount)}</span>${pt(p.status)}</div>`).join('')}`}
async function sendPay(e){e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('button');btn.disabled=true;
 try{const url=await upload(f.get('file'),'receipts');const plan=f.get('plan');
 const {error}=await sb.from('tm_payments').insert({venue_id:S.my.id,plan,amount:+S.set['price_'+plan],receipt_url:url});if(error)throw error;
 toast('Chek yuborildi. Admin tekshiradi');tabPay()}catch(err){toast(err.message,1);btn.disabled=false}}

async function adminPage(){S.onLive=null;
 if(S.role!=='admin'){$('#app').innerHTML='<div class="wrap">'+empty("Ruxsat yo'q")+'</div>';return}
 $('#app').innerHTML=`<div class="wrap"><h2>Admin panel</h2><div class="tabs">${[['stats','Umumiy'],['venues','Kafelar'],['pays','Cheklar'],['orders','Buyurtmalar'],['set','Sozlamalar'],['acc','Hisob']].map(t=>`<button class="tab ${A.tab===t[0]?'on':''}" onclick="A.tab='${t[0]}';adminPage()">${t[1]}</button>`).join('')}</div><div id="abody"></div></div>`;
 ({stats:aStats,venues:aVenues,pays:aPays,orders:aOrders,set:aSet,acc:aAcc})[A.tab]()}
async function cnt(t,f){let q=sb.from(t).select('*',{count:'exact',head:true});if(f)q=f(q);const {count}=await q;return count||0}
async function aStats(){
 const [all,act,pen,ord,pp]=await Promise.all([cnt('venues'),cnt('venues',q=>q.eq('status','active')),cnt('venues',q=>q.eq('status','pending')),cnt('orders'),cnt('payments',q=>q.eq('status','pending'))]);
 $('#abody').innerHTML=`<div class="stats"><div class="stat"><b>${all}</b>Jami kafelar</div><div class="stat"><b>${act}</b>Faol kafelar</div><div class="stat"><b>${pen}</b>Tasdiq kutayotgan</div><div class="stat"><b>${pp}</b>Tekshirilmagan chek</div><div class="stat"><b>${ord}</b>Jami buyurtmalar</div></div>`}
async function aVenues(){
 const {data}=await sb.from('tm_venues').select('*').order('created_at',{ascending:false});S.av=data||[];
 $('#abody').innerHTML=`<div class="search" style="margin-bottom:8px">${ic('search')}<input placeholder="Kafe nomi yoki telefon..." value="${esc(A.vq||'')}" oninput="A.vq=this.value;avList()"></div><div class="chips">${[['all','Hammasi'],['pending','Tasdiq kutilmoqda'],['active','Faol'],['blocked','Bloklangan']].map(([k,l])=>`<button class="chip ${(A.vf||'all')===k?'on':''}" onclick="A.vf='${k}';aVenues()">${l}</button>`).join('')}</div><div id="avl"></div>`;avList()}
function avList(){const f=A.vf||'all',q=(A.vq||'').toLowerCase();
 const l=S.av.filter(v=>(f==='all'||v.status===f)&&(!q||(v.name+' '+(v.phone||'')).toLowerCase().includes(q)));
 $('#avl').innerHTML=l.map(v=>`<div class="box"><div class="row sp"><b>${esc(v.name)}</b>${vstat(v)}</div><small>${esc(v.category)} · ${esc(v.phone||'')}</small>
 <div class="row" style="margin:8px 0"><label style="flex:1;margin:0">Tarif<select onchange="vUp('${v.id}',{plan:this.value})"><option value="standard" ${v.plan==='standard'?'selected':''}>Oddiy</option><option value="super" ${v.plan==='super'?'selected':''}>Super Pro</option></select></label><label style="flex:1;margin:0">Muddat<input type="date" value="${v.paid_until||''}" onchange="vUp('${v.id}',{paid_until:this.value||null})"></label></div>
 <div class="row"><button class="btn sm ok" onclick="vUp('${v.id}',{status:'active'})">${ic('check',15)} Faollashtirish</button><button class="btn sm bad" onclick="vUp('${v.id}',{status:'blocked'})">Bloklash</button><button class="btn sm" onclick="vEdit('${v.id}')">${ic('edit',15)}</button><a class="btn sm" href="#/v/${v.id}">Ko'rish</a><button class="btn sm bad" onclick="vDel('${v.id}')">${ic('trash',15)}</button></div></div>`).join('')||empty("Kafelar yo'q")}
function vEdit(id){const v=S.av.find(x=>x.id===id);if(!v)return;
 modal(`<div class="row sp"><h3 style="margin:0">Kafeni tahrirlash</h3><button class="btn sm" onclick="closeModal()">${ic('x',16)}</button></div><form onsubmit="vSave(event,'${id}')"><label>Nomi<input name="name" required value="${esc(v.name)}"></label><label>Turi<select name="category">${catOpts(v.category)}</select></label><label>Telefon<input name="phone" value="${esc(v.phone)}"></label><label>Manzil<input name="address" value="${esc(v.address)}"></label><label>Ish vaqti<input name="open_hours" value="${esc(v.open_hours)}"></label><label>Tavsif<textarea name="description" rows="3">${esc(v.description)}</textarea></label><button class="btn pri full">Saqlash</button></form>`)}
async function vSave(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {error}=await sb.from('tm_venues').update(f).eq('id',id);if(error)return toast(error.message,1);closeModal();toast('Saqlandi');aVenues()}
function aAcc(){const u=S.user;
 $('#abody').innerHTML=`<form class="box" onsubmit="saveAcc(event)"><h3 class="sh">Admin hisobi</h3><label>Ism<input name="name" value="${esc(u.user_metadata?.full_name||'')}"></label><label>Email<input name="email" type="email" required value="${esc(u.email)}"></label><label>Yangi parol (o'zgartirmasangiz bo'sh qoldiring)<input name="password" type="password" minlength="8" autocomplete="new-password"></label><label>Yangi parolni takrorlang<input name="password2" type="password" minlength="8" autocomplete="new-password"></label><button class="btn pri full">Saqlash</button></form><div class="box"><small>Email yoki parol o'zgargach, qayta kirishingiz kerak bo'ladi.</small></div>`}
async function saveAcc(e){e.preventDefault();const f=new FormData(e.target),pw=f.get('password');
 if(pw&&pw!==f.get('password2'))return toast('Parollar mos kelmadi',1);
 const {error}=await sb.rpc('tm_admin_update_account',{p_email:String(f.get('email')).trim().toLowerCase(),p_password:pw||null,p_name:f.get('name')||null});
 if(error)return toast(error.message,1);
 toast('Saqlandi. Qayta kiring');await sb.auth.signOut();await loadUser();location.hash='#/login'}
async function vUp(id,o){const {error}=await sb.from('tm_venues').update(o).eq('id',id);if(error)return toast(error.message,1);toast('Saqlandi');aVenues()}
async function vDel(id){if(!confirm(tr("Kafe va uning barcha ma'lumotlari o'chadi. Davom etamizmi?")))return;await sb.from('tm_venues').delete().eq('id',id);aVenues()}
async function aPays(){
 const {data}=await sb.from('tm_payments').select('*,tm_venues(name)').order('status',{ascending:false}).order('created_at',{ascending:false}).limit(80);
 const pt=s=>s==='approved'?'<span class="tag green">Tasdiqlangan</span>':s==='rejected'?'<span class="tag red">Rad etilgan</span>':'<span class="tag yel">Kutilmoqda</span>';
 $('#abody').innerHTML=(data||[]).map(p=>`<div class="box"><div class="row sp"><b>${esc(p.tm_venues?.name)}</b>${pt(p.status)}</div><p>${p.plan==='super'?'Super Pro':'Oddiy'} · ${som(p.amount)} · ${new Date(p.created_at).toLocaleString(LOC())}</p>${p.receipt_url?`<a href="${esc(p.receipt_url)}" target="_blank"><img class="rc" src="${esc(p.receipt_url)}"></a>`:''}${p.status==='pending'?`<div class="row" style="margin-top:8px"><button class="btn ok" onclick="payOk('${p.id}')">${ic('check',16)} Tasdiqlash (+30 kun)</button><button class="btn bad" onclick="payNo('${p.id}')">Rad etish</button></div>`:''}</div>`).join('')||empty('Cheklar yo\'q')}
async function payOk(id){const {data:p}=await sb.from('tm_payments').select('*,tm_venues(*)').eq('id',id).single();
 const base=p.tm_venues.paid_until&&p.tm_venues.paid_until>today()?new Date(p.tm_venues.paid_until):new Date();base.setDate(base.getDate()+30);
 const r1=await sb.from('tm_venues').update({plan:p.plan,paid_until:base.toISOString().slice(0,10),status:p.tm_venues.status==='blocked'?'blocked':'active'}).eq('id',p.venue_id);
 if(r1.error)return toast(r1.error.message,1);
 await sb.from('tm_payments').update({status:'approved'}).eq('id',id);toast('Tasdiqlandi');aPays()}
async function payNo(id){await sb.from('tm_payments').update({status:'rejected'}).eq('id',id);aPays()}
async function aOrders(){
 const {data}=await sb.from('tm_orders').select('*,tm_venues(name)').order('created_at',{ascending:false}).limit(60);
 $('#abody').innerHTML=(data||[]).map(o=>`<div class="ord st-${o.status}"><div class="row sp"><b>${esc(o.tm_venues?.name)}</b><span class="tag">${ST[o.status]}</span></div><small>${esc(o.customer_name)} · ${esc(o.phone)} · ${TY[o.type]} · ${new Date(o.created_at).toLocaleString(LOC())}</small><div>${o.items.map(i=>`${esc(i.n)} x${i.q}`).join(', ')}</div><b>${som(o.total)}</b></div>`).join('')||empty('Buyurtmalar yo\'q')}
function aSet(){const s=S.set;const f=(k,l,t='text')=>`<label>${l}<input name="${k}" type="${t}" value="${esc(s[k])}"></label>`;
 $('#abody').innerHTML=`<form class="box" onsubmit="saveSet(event)">${f('price_standard',"Oddiy tarif narxi (oyiga)",'number')}${f('price_super','Super Pro narxi (oyiga)','number')}${f('card','Karta raqami')}${f('card_owner','Karta egasi')}${f('admin_phone','Admin telefoni')}<label>Bosh sahifadagi e'lon (hammaga ko'rinadi)<textarea name="announcement" rows="3">${esc(s.announcement)}</textarea></label><button class="btn pri full">Saqlash</button></form>`}
async function saveSet(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 const {error}=await sb.from('tm_settings').upsert(Object.entries(f).map(([key,value])=>({key,value})));if(error)return toast(error.message,1);S.set={...S.set,...f};toast('Saqlandi. Hammaga ko\'rinadi')}

/* ---------- Ishga tushirish ---------- */
(async()=>{
 if(!sb){$('#app').innerHTML='<div class="wrap"><div class="box"><b>Sozlash kerak</b><p>Faylning yuqorisidagi CFG ga Supabase URL va ANON KEY ni qo\'ying.</p></div></div>';return}
 await loadUser();await loadCommon();route();
 window.addEventListener('hashchange',route);
 sb.auth.onAuthStateChange(async()=>{await loadUser()});
 let tm;sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},(p)=>{if(!String(p.table||'').startsWith('tm_'))return;if(p.table==='tm_orders'&&p.eventType==='INSERT'&&S.user&&SET.sound){beep();toast('Yangi buyurtma keldi!')}clearTimeout(tm);tm=setTimeout(async()=>{await loadCommon();if($('#modal'))return;if(S.onLive)S.onLive();else list()},500)}).subscribe();
})();
</script>
